<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Analiza Dokumentów V2{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='v2/css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Topbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark topbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/v2"><i class="fa-solid fa-robot text-primary me-2"></i>AI Analiza V2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-secondary btn-sm px-3" href="/"><i class="fa-solid fa-arrow-left me-1"></i> Powrót do V1</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/v2' %}active{% endif %}" href="/v2">
                                <i class="fa-solid fa-upload me-2"></i> Wgraj i Analizuj
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted" href="#" aria-disabled="true">
                                <i class="fa-solid fa-database me-2"></i> Historia (Wkrótce)
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted" href="#" aria-disabled="true">
                                <i class="fa-solid fa-cog me-2"></i> Ustawienia (Wkrótce)
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='v2/js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
